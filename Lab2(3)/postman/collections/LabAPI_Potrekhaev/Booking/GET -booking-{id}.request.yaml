$kind: http-request
name: GET /booking/{id}
url: "{{baseUrl}}/booking/{{bookingId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: ""
    value: null
    disabled: true
    description: Получить созданное бронирование; ожидается 200
scripts:
  - type: afterResponse
    code: "pm.test('Статус 200',()=>pm.response.to.have.status(200));\r

      pm.test('Время < 2000 мс',()=>pm.expect(pm.response.responseTime).below(2000));\r

      pm.test('Есть bookingdates',()=>pm.expect(pm.response.json()).to.have.property('bookingdates'));"
    language: text/javascript
order: 3000
