  type: json
  content: "{\r

    \    \"firstname\": \"\", \r

    \    \"lastname\": \"\", \r

    \    \"totalprice\": 100,\r

    \    \"depositpaid\": false,\r

    \    \"bookingdates\": {\r

    \        \"checkin\": \"2025-01-01\",\r

    \        \"checkout\": \"2025-01-02\"\r

    \        }\r

    }"
scripts:
