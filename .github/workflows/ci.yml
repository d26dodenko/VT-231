name: Lab 3 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, lint and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: lab3/shop/frontend
        run: npm ci
      - name: Lint
        working-directory: lab3/shop/frontend
        run: npm run lint
      - name: Unit tests and coverage gate
        working-directory: lab3/shop/frontend
        env:
          DEMO_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          mkdir -p coverage
          set -o pipefail
          if [[ "$DEMO_MESSAGE" == *'[gate-unit]'* ]]; then
            printf '\ntest("intentional gate demonstration", () => assert.equal(1, 2));\n' >> unit/cartPricing.test.mjs
          fi
          if [[ "$DEMO_MESSAGE" == *'[gate-coverage]'* ]]; then
            node --experimental-strip-types --experimental-test-coverage --test-coverage-include=src/utils/cartPricing.ts --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 --test-name-pattern='^empty subtotal$' --test unit/cartPricing.test.mjs | tee coverage/coverage.txt
          else
            npm run test:unit:coverage | tee coverage/coverage.txt
          fi
      - name: Upload unit and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: lab3/shop/frontend/coverage/
          if-no-files-found: ignore

  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python scanners
        run: python -m pip install -r lab3/requirements.txt
      - name: Python lint and Bandit (high severity)
        working-directory: lab3
        run: |
          mkdir -p reports
          python -m ruff check tests
          python -m bandit -r tests --severity-level high --confidence-level high --skip B101 -f json -o reports/bandit.json
      - name: Demonstrate critical dependency gate
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gate-security]')
        working-directory: lab3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit-demo"
          cd "$RUNNER_TEMP/audit-demo"
          npm init -y
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact minimist@0.0.8
          set -o pipefail
          npm audit --audit-level=critical --json | tee "$GITHUB_WORKSPACE/lab3/reports/demo-audit.json"
      - name: Audit frontend dependencies
        working-directory: lab3/shop/frontend
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=critical --json | tee ../../reports/frontend-audit.json
      - name: Audit backend dependencies
        working-directory: lab3/shop/backend
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=critical --json | tee ../../reports/backend-audit.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: lab3/reports/
          if-no-files-found: ignore

  build:
    name: Build
    needs: [unit, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: lab3/shop/frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: shop-dist
          path: lab3/shop/frontend/dist/
          if-no-files-found: error

  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: '5001'
      MONGO_URI: mongodb://127.0.0.1:27017/guziev_lab3_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r lab3/requirements.txt
      - name: Prepare backend
        working-directory: lab3/shop/backend
        run: |
          npm ci
          node scripts/seedProducts.js
          JWT_SECRET=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))") nohup node index.js > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5001/; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Run API integration tests
        working-directory: lab3
        run: python -m pytest tests/integration -v --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: |
            lab3/reports/integration.xml
            lab3/shop/backend/backend.log
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E
    needs: integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: '5001'
      MONGO_URI: mongodb://127.0.0.1:27017/guziev_lab3_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r lab3/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: shop-dist
          path: lab3/shop/frontend/dist
      - name: Prepare backend
        working-directory: lab3/shop/backend
        run: |
          npm ci
          node scripts/seedProducts.js
          JWT_SECRET=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))") nohup node index.js > backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5001/; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Serve built frontend
        working-directory: lab3/shop/frontend
        run: |
          npm ci
          nohup npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > frontend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat frontend.log
          exit 1
      - name: Run browser tests
        working-directory: lab3
        run: python -m pytest tests/e2e -v --junitxml=reports/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            lab3/reports/
            lab3/shop/backend/backend.log
            lab3/shop/frontend/frontend.log
          if-no-files-found: ignore

  release:
    name: Release package
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shop-dist
          path: release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-dist/
          if-no-files-found: error
